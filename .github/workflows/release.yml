name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Required so the workflow's GITHUB_TOKEN can create/update the GitHub Release
# and upload the built assets to it.
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.prefix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prefix: x86_64-linux
            target: x86_64-unknown-linux-gnu
            cross: false
          - prefix: i686-linux
            target: i686-unknown-linux-gnu
            cross: true
          - prefix: aarch64-linux
            target: aarch64-unknown-linux-gnu
            cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package assets
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          archive="flavours-${tag}-${{ matrix.prefix }}"
          cd "target/${{ matrix.target }}/release"
          cp "$GITHUB_WORKSPACE/example.toml" config.toml
          cp "$GITHUB_WORKSPACE/README.md" README.md
          cp "$GITHUB_WORKSPACE/LICENSE" LICENSE
          tar czvf "${archive}.tar.gz" flavours config.toml README.md LICENSE
          shasum -a 256 "${archive}.tar.gz" > "${archive}.sha256"

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/flavours-*
